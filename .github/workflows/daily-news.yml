name: Daily Design News Bot

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic feedparser requests beautifulsoup4 python-dateutil lxml \
                      google-auth google-auth-httplib2 google-api-python-client
      - name: Create required directories
        run: mkdir -p reports logs data
      - name: Run bot
        id: runbot
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY:      ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID:         ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          cd src
          python main.py 2>&1 | tee ../run_output.txt
          exit ${PIPESTATUS[0]}
      - name: Save debug log on failure
        if: always()
        run: |
          mkdir -p data
          cp run_output.txt data/last_run_output.txt || echo "no output file"
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/last_run_output.txt
          git commit -m "chore: save last run log [skip ci]" || echo "nothing to commit"
          git push
      - name: Commit cache to repo
        if: steps.runbot.outcome == 'success'
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/cache_fa.json data/cache_en.json
          git commit -m "chore: refresh news cache [skip ci]" || echo "nothing to commit"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: design-news-${{ github.run_id }}
          path: reports/
          retention-days: 30
      - name: Fail job if bot run failed
        if: steps.runbot.outcome == 'failure'
        run: exit 1
