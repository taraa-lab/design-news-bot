name: Test Gemini

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests anthropic feedparser beautifulsoup4 python-dateutil lxml
      - name: Probe Gemini endpoints
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: cd src && python test_gemini.py
      - name: Save result (no secrets inside)
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/gemini_test.json || true
          git commit -m "chore: gemini test result [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main && git push
