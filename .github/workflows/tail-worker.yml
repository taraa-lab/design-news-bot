name: Tail Worker Logs

on:
  workflow_dispatch:
    inputs:
      update_json:
        description: "Telegram update JSON to POST to the Worker"
        required: true

permissions:
  contents: write

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g wrangler

      - name: Start tail in background
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          nohup wrangler tail --format json > ../tail_output.json 2>&1 &
          echo $! > ../tail_pid.txt
          sleep 10

      - name: Send update to Worker
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          UPDATE_JSON:    ${{ inputs.update_json }}
        run: |
          curl -s -X POST "https://design-news-bot.newsbot.workers.dev" -H "Content-Type: application/json" -H "X-Telegram-Bot-Api-Secret-Token: ${WEBHOOK_SECRET}" -d "$UPDATE_JSON"
          echo ""
          sleep 12

      - name: Stop tail and show logs
        run: |
          kill $(cat tail_pid.txt) 2>/dev/null || true
          sleep 2
          cat tail_output.json

      - name: Save logs to repo
        run: |
          mkdir -p data
          cp tail_output.json data/tail_output.json
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/tail_output.json
          git commit -m "chore: record worker tail logs [skip ci]" || echo "nothing to commit"
          git push
